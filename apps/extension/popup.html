<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Scout</title>
    <style>
      @font-face {
        font-family: "Manrope";
        src: url("fonts/Manrope-Variable.ttf") format("truetype-variations");
        font-weight: 200 800;
        font-display: swap;
      }
      :root {
        --bg: #121316;
        --card: #1c1d21;
        --ink: #f2f1ee;
        --ink-muted: #908f94;
        --accent: #ff4a26;
        --line: rgba(242, 241, 238, 0.09);
        --good: #55b478;
        --warn: #e0a73e;
      }
      * { box-sizing: border-box; }
      body {
        width: 360px;
        max-height: 500px;
        overflow-y: auto;
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Manrope", -apple-system, "Segoe UI", Arial, sans-serif;
        font-size: 13px;
      }
      header {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        font-weight: 700;
        font-size: 15px;
      }
      header .accent { color: var(--accent); }
      #content { padding: 14px; }
      .muted { color: var(--ink-muted); }
      .state-message { text-align: center; padding: 24px 8px; color: var(--ink-muted); }
      .scan-summary { margin-bottom: 12px; }
      .scan-summary .category {
        display: inline-block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--ink-muted);
      }
      .scan-summary h2 { margin: 2px 0 4px; font-size: 15px; }
      .scan-summary p { margin: 0; color: var(--ink-muted); line-height: 1.4; }
      .matches { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      .match {
        display: flex;
        gap: 10px;
        padding: 8px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        text-decoration: none;
        color: inherit;
      }
      .match img { width: 48px; height: 48px; object-fit: contain; border-radius: 4px; background: var(--bg); flex-shrink: 0; }
      .match .info { min-width: 0; }
      .match .title { font-size: 12.5px; line-height: 1.3; margin: 0 0 3px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .match .merchant { color: var(--ink-muted); font-size: 11.5px; }
      .match .price { font-weight: 700; margin-top: 2px; }
      .error-message { color: var(--warn); }
      .no-matches { color: var(--ink-muted); font-size: 12.5px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <header>Sc<span class="accent">out</span></header>
    <div id="content">
      <div class="state-message">Chargement…</div>
    </div>
    <script src="dist/popup.js"></script>
  </body>
</html>
